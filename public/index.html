<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VendGuard — Gestor de Incidencias de Vending</title>
  
  <!-- Docker Design Tokens & Webfonts -->
  <link rel="stylesheet" href="/assets/css/design-tokens.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232560ff'/><text y='.9em' font-size='70' x='18' fill='white' font-family='sans-serif' font-weight='bold'>V</text></svg>">
</head>
<body style="margin: 0; padding: 0; background-color: var(--color-canvas, #f9fafb); font-family: var(--font-body, Inter, sans-serif); color: var(--color-slate, #2c333f);">
  <!-- Vue 3 Root Mount Container -->
  <div id="app">
    <!-- Fallback while Vue 3 ESM loads -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; font-family: sans-serif; color: #6c7e9d;">
      <div style="width: 48px; height: 48px; border-radius: 4px; background-color: #2560ff; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 24px; font-weight: bold;">V</div>
      <div style="font-size: 16px; font-weight: 600; color: #2c333f;">Cargando VendGuard...</div>
    </div>
  </div>

  <!-- Error Diagnostics Handler -->
  <script>
    window.addEventListener('error', function(e) {
      console.error('VendGuard Global Error:', e);
      var app = document.getElementById('app');
      if (app && app.innerText.indexOf('Cargando VendGuard...') !== -1) {
        app.innerHTML = '<div style="max-width: 600px; margin: 40px auto; padding: 24px; font-family: sans-serif; background: #fff5f5; border: 1px solid #feb2b2; border-radius: 8px; color: #9b2c2c;">' +
          '<h3 style="margin-top:0;">Error al cargar la aplicación</h3>' +
          '<p style="font-size: 13px; font-family: monospace; background: #fee2e2; padding: 8px; border-radius: 4px;">' + (e.message || 'Error de script') + '</p>' +
          '<button onclick="location.reload()" style="padding: 8px 16px; background: #2560ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Recargar página</button>' +
          '</div>';
      }
    });
  </script>

  <!-- Vanilla Vue 3 Application Root (ES Module) -->
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>

        total: audits.length,
        limit: 100,

    api.coordinator.downloadDexAuditRaw = async () => true;
    api.coordinator.exportDexAuditsCsv = async () => true;

    const Root = {
      components: { CoordinatorDexAuditsSubTab },
      template: '<div style="padding: 12px;"><CoordinatorDexAuditsSubTab ref="dex" /></div>'
    };

    try {
      const app = Vue.createApp(Root);
      const root = app.mount('#app');
      const vm = root.$refs.dex;

      const deadline = Date.now() + 10000;
      while (vm.isLoading && Date.now() < deadline) {
        await new Promise((resolve) => setTimeout(resolve, 25));
      }
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      if (document.fonts?.ready) {
        await document.fonts.ready;
      }

      window.__vm = vm;
      window.__harness = {
        async openDetail() {
          await vm.openDetail(vm.audits[0]);
          await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        },
        openVoid() {
          vm.openVoid(vm.audits[0]);
          vm.voidReason = 'La consola detectó un fichero duplicado del mismo turno; se conserva el original y se anula únicamente el registro duplicado con evidencia del hash.';
        },
        closeAll() {
          vm.closeDetail();
          vm.closeVoid();
        },
        openEmptyDetail() {
          vm.audits = [];
          vm.kpis = { total_active: 0, thermal_alert_count: 0, warning_count: 0, cash_deviation_count: 0, voided_count: 0 };
        }
      };
      window.__harnessState = { audits: vm.audits.length, kpis: vm.safeKpis, error: null };
      window.__harnessReady = true;
    } catch (error) {
      window.__harnessState = { error: error?.message ?? String(error) };
      window.__harnessReady = true;
    }

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VendGuard · sonda 360 · CoordinatorProductLoadingTab</title>
  <link rel="stylesheet" href="/assets/css/design-tokens.css">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
    body { background: var(--color-canvas, #f9fafb); font-family: var(--font-body, Inter, sans-serif); color: var(--color-slate, #2c333f); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import * as Vue from '/assets/js/vendor/vue.esm-browser.prod.js';
    window.Vue = Vue;
    const { api } = await import('/assets/js/api.js');
    const { CoordinatorProductLoadingTab } = await import('/assets/js/components/CoordinatorProductLoadingTab.js');

    const collection = {
      id: 901,
      collection_code: 'MCC-2026-0901',
      collected_at: '2026-11-14T09:00:00+00:00',
      restocker_name_snapshot: 'Lucía Gómez',
      machine_code_snapshot: 'VEND-0701',
      location_name: 'Hospital del Mar',
      bag_seal_code: 'BAG-CCV11-0001',
      expected_cashbox_eur: 40,
      status: 'DELIVERED_TO_VAULT',
      status_label: 'Entregada en cámara',
      vault_counted_eur: null,
      discrepancy_eur: null,
      reception_cash_delivered_eur: 2.5,
      receptionist_name: 'Conserje Recepción',
      restock_visit_id: null,
      is_terminal: false,
      previous_sales_counter_reading: 80,
      sales_counter_reading: 120,
      is_counter_reset: false,
      counter_reset_notes: null,
      discrepancy_justification: null,
      vault_reconciled_by_name_snapshot: null,
      vault_reconciled_at: null
    };

    const restocker = { id: 12, name: 'Lucía Gómez', operator_code: 'REP-01', is_active: true };
    const cashKpis = {
      pending_vault_bags_count: 1,
      reconciled_ok_count: 2,
      discrepancy_flagged_count: 1,
      total_vault_counted_eur: 120.5,
      net_discrepancy_eur: -1.5,
      total_route_cash_deployed_eur: 14.5
    };

    api.coordinator.getProductLoadingOrders = async () => ({ data: { kpis: {}, orders: [] } });
    api.coordinator.getUsers = async () => ({ data: [restocker] });
    api.coordinator.getRestockerVanStocks = async () => ({ data: { kpis: {}, stocks: [] } });
    api.coordinator.getRestockVisits = async () => ({ data: { kpis: {}, visits: [] } });
    api.coordinator.getCashCollections = async () => ({ data: { kpis: cashKpis, cash_collections: [collection] } });
    api.coordinator.getCashCollection = async () => ({ data: collection });
    api.coordinator.getCashCollectionReceptionReceipt = async () => ({
      data: {
        collection_code: 'MCC-2026-0901',
        collected_at: '2026-11-14T09:00:00+00:00',
        location_code: 'HOSP-MAR',
        location_name: 'Hospital del Mar',
        machine_code: 'VEND-0701',
        restocker_name: 'Lucía Gómez',
        receptionist_name: 'Conserje Recepción',
        reception_cash_delivered_eur: 2.5,
        linked_refund_request_id: 501
      }
    });

    const app = Vue.createApp(CoordinatorProductLoadingTab);
    const vm = app.mount('#app');
    vm.restockers = [restocker];
    vm.cashKpis = cashKpis;
    vm.cashCollections = [collection];
    vm.activeSection = 'cash';

    window.__vm = vm;
    window.__harness = {
      openDetail() {
        vm.selectedCashId = collection.id;
        vm.cashDetail = collection;
        vm.cashDetailError = '';
        vm.isLoadingCashDetail = false;
        vm.cashReconcileForm = { vault_counted_eur: '', discrepancy_justification: '' };
        vm.showCashDetailModal = true;
      },
      openReceipt() {
        vm.cashReceipt = {
          collection_code: 'MCC-2026-0901',
          collected_at: '2026-11-14T09:00:00+00:00',
          location_code: 'HOSP-MAR',
          location_name: 'Hospital del Mar',
          machine_code: 'VEND-0701',
          restocker_name: 'Lucía Gómez',
          receptionist_name: 'Conserje Recepción',
          reception_cash_delivered_eur: 2.5,
          linked_refund_request_id: 501
        };
        vm.showCashReceiptModal = true;
      },
      closeAll() {
        vm.showCashDetailModal = false;
        vm.showCashReceiptModal = false;
      }
    };

    await document.fonts.ready;
    await vm.$nextTick();
    await new Promise((resolve) => setTimeout(resolve, 100));
    window.__harnessReady = true;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VendGuard · sonda 360 · SAT TechnicianRouteView</title>
  <link rel="stylesheet" href="/assets/css/design-tokens.css">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
    body { background: var(--color-canvas, #f9fafb); font-family: var(--font-body, Inter, sans-serif); color: var(--color-slate, #2c333f); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import * as Vue from '/assets/js/vendor/vue.esm-browser.prod.js';
    window.Vue = Vue;
    const { api } = await import('/assets/js/api.js');
    const { store } = await import('/assets/js/store.js');
    const { TechnicianRouteView } = await import('/assets/js/views/TechnicianRouteView.js');

    const incident = {
      id: 701,
      ticket_code: 'INC-2026-0701',
      urgency: 'HIGH',
      status: 'ASSIGNED',
      category: 'PRODUCT_JAM',
      description: 'Atasco persistente en el carril 21 después de la reposición. La sede pide revisión técnica antes de reabrir la máquina.',
      started_at: null,
      pending_parts_reason: null,
      paused_at: null,
      total_pending_info_seconds: 0,
      pending_info_reason_category: null,
      pending_info_reason_text: null,
      site_response_since_pause: false,
      comments_count: 3,
      machine_id: 7,
      machine_model: 'Jofemar Vision',
      machine_type_snapshot: 'COMBO',
      escalated_from_restocker_id: 12,
      escalated_to_sat_at: '2026-11-19T10:05:00+00:00',
      workshop_internal_note: 'El reponedor confirma que el carril queda bloqueado tras retirar un envase deformado. Revisar el sensor de espiral antes de volver a cargar producto.',
      workshop_internal_note_at: '2026-11-19T10:04:00+00:00',
      workshop_internal_note_author: 'Lucía Gómez',
      workshop_internal_photo_path: '/assets/seed/spoilage/ACTA-MERMA-2026-0001.jpg',
      photo_path: '/assets/seed/spoilage/ACTA-MERMA-2026-0001.jpg',
      sla_tier_snapshot: 'STANDARD',
      sla_tier_label: 'Estándar',
      sla_target_minutes: 480,
      sla_target_at: '2026-11-19T18:05:00+00:00',
      sla_due_at: '2026-11-19T18:05:00+00:00',
      critical_reason: null,
      is_cold_chain_critical: false,
      is_contractual_critical: false,
      sanitary_resolution_required: false,
      colocation_count: 1,
      colocation_primary: false,
      machine: {
        id: 7,
        code: 'VEND-0701',
        model: 'Jofemar Vision',
        machine_type: 'COMBO',
        floor_wing: 'Planta baja · ala este'
      },
      location: {
        id: 1,
        name: 'Hospital del Mar',
        address: 'Passeig Marítim 25, Barcelona',
        contact_phone: '+34 932 555 123',
        latitude: 41.3851,
        longitude: 2.1973
      },
      site_coincidence: [{
        user_id: 12,
        name: 'Lucía Gómez',
        operator_code: 'REP-01',
        role: 'RESTOCKER',
        shift_status: 'ON_SHIFT',
        phone: '+34 600 111 222',
        activity_summary: 'Aviso L1 escalado desde esta sede'
      }],
      van_stock_readiness: {
        status: 'NOT_APPLICABLE',
        badge_label: null,
        detail: null
      }
    };

    api.technician.getMyRoute = async () => ({ stops: [incident] });
    api.get = async (url) => {
      if (url === '/technician/shift/status') {
        return {
          data: {
            status: 'ON_SHIFT',
            active_shift_id: 88,
            today_summary: { effective_seconds: 5400, pause_seconds: 0 }
          }
        };
      }
      return { data: [] };
    };
    api.getTroubleshootingGuidesByModel = async () => ({ guides: [] });
    api.technician.getOfflineBootstrap = async () => ({
      data: {
        technician: { id: 7, name: 'Técnico SAT', role: 'TECHNICIAN' },
        generated_at: '2026-11-19T10:00:00+00:00',
        stops: [incident],
        preventive_orders: [],
        van_stock: [],
        troubleshooting_guides: []
      }
    });
    api.post = async (url) => {
      throw new Error('POST inesperado: ' + url);
    };

    store.state.user = {
      id: 7,
      name: 'Técnico SAT',
      email: 'tecnico.sat@vendguard.local',
      role: 'TECHNICIAN',
      operator_code: 'SAT-07'
    };
    store.state.token = 'harness-token';

    const app = Vue.createApp(TechnicianRouteView);
    const vm = app.mount('#app');
    window.__vm = vm;

    const deadline = Date.now() + 10000;
    while (Date.now() < deadline) {
      if (!vm.isLoading && vm.incidents.length > 0) {
        break;
      }
      await new Promise((resolve) => setTimeout(resolve, 50));
    }

    await document.fonts.ready;
    await vm.$nextTick();
    await new Promise((resolve) => setTimeout(resolve, 100));
    window.__harnessState = {
      incidents: vm.incidents.length,
      errorMessage: vm.errorMessage,
      isOfflineMode: vm.isOfflineMode
    };
    window.__harnessReady = true;
  </script>
</body>
</html>
